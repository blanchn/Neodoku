<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NekoDoku</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        :root { --bg-color: #fcf8f2; --card-color: #ffffff; --text-color: #3c2f2f; --border-color: #dcd6cd; --color-0: #ffdfdf; --color-1: #dfffee; --color-2: #dfeeff; --color-3: #fffeed; --color-4: #f3dfff; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; user-select: none; -webkit-user-select: none; }
        .container { width: 100%; max-width: 450px; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 15px; }
        header { text-align: center; } h1 { margin: 0; font-size: 2rem; }
        .rules { font-size: 0.85rem; background-color: #fff; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); line-height: 1.4; }
        .status-bar { display: flex; justify-content: space-between; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr); gap: 4px; width: 100%; aspect-ratio: 1 / 1; background-color: var(--border-color); padding: 4px; border-radius: 12px; box-sizing: border-box; }
        .cell { background-color: var(--card-color); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; cursor: pointer; border-radius: 6px; transition: background-color 0.2s; touch-action: manipulation; position: relative; }
        .reg-0 { background-color: var(--color-0); } .reg-1 { background-color: var(--color-1); } .reg-2 { background-color: var(--color-2); } .reg-3 { background-color: var(--color-3); } .reg-4 { background-color: var(--color-4); }
        .cell.wrong { background-color: #ffb3b3 !important; } .cell.hint-preview { animation: pulse-hint 1.5s infinite alternate; z-index: 5; }
        @keyframes pulse-hint { 0% { box-shadow: inset 0 0 0 3px #ecc94b; background-color: #fefcbf; } 100% { box-shadow: inset 0 0 0 5px #d69e2e; background-color: #faf089; } }
        .hint-box { display: none; background-color: #feebc8; border: 1px solid #fbd38d; color: #c05621; padding: 12px; border-radius: 10px; font-size: 0.9rem; line-height: 1.4; font-weight: 500; margin-top: 5px; }
        .tools { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .action-btn { flex: 1; min-width: 120px; padding: 12px; font-size: 1.05rem; font-weight: bold; background-color: #4a5568; color: white; border: none; border-radius: 10px; cursor: pointer; }
        .hint-btn { background-color: #ff8e9e; } .apply-btn { background-color: #319795; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>🐱 NekoDoku</h1></header>
        <div class="rules"><strong>Contrôles :</strong> Un clic = ❌ | Double-clic = 🐱 <br><strong>Règles :</strong> 1 Chat par ligne/colonne/couleur. Pas de contact.</div>
        <div class="status-bar"><div>Niveau: 5x5 Facile</div><div id="hearts-display">❤️❤️❤️</div></div>
        <div class="grid" id="game-grid"></div>
        <div class="hint-box" id="hint-explanation"></div>
        <div class="tools">
            <button class="action-btn hint-btn" id="btn-hint" onclick="prepareHint()">Indice 💡</button>
            <button class="action-btn apply-btn" id="btn-apply" onclick="applyHint()">Appliquer l'indice ⚡</button>
            <button class="action-btn" onclick="resetBoard()">Recommencer</button>
        </div>
    </div>
    <script>
        const layoutString = "0001102213224334444344433";
        const regions = layoutString.split("").map(function(c) { return parseInt(c, 10); });
        const solution = [false, true, false, false, false, false, false, false, true, false, true, false, false, false, false, false, false, true, false, false, false, false, false, false, true];
        let playerGrid = Array(25).fill(""); let hearts = 3; let clickTimers = {}; let pendingHintCell = null;
        function drawGrid() {
            const g = document.getElementById('game-grid'); g.innerHTML = "";
            for (let i = 0; i < 25; i++) {
                const c = document.createElement('div'); c.className = "cell reg-" + regions[i]; c.textContent = playerGrid[i];
                if (pendingHintCell === i && playerGrid[i] === "") { c.classList.add('hint-preview'); c.textContent = "❓"; }
                c.addEventListener('click', function(e) { e.preventDefault(); handleGridTouch(i, c); }); g.appendChild(c);
            }
        }
        function handleGridTouch(i, ce) {
            if (hearts <= 0) return; cancelCurrentHint();
            if (clickTimers[i]) { clearTimeout(clickTimers[i]); clickTimers[i] = null; executeDoubleClicks(i, ce); }
            else { clickTimers[i] = setTimeout(function() { clickTimers[i] = null; executeSingleClick(i); }, 250); }
        }
        function executeSingleClick(i) { playerGrid[i] = (playerGrid[i] === "❌" || playerGrid[i] === "🐱") ? "" : "❌"; drawGrid(); }
        function executeDoubleClicks(i, ce) {
            if (playerGrid[i] === "🐱") { playerGrid[i] = ""; drawGrid(); return; }
            if (solution[i] === true) { playerGrid[i] = "🐱"; drawGrid(); checkWinCondition(); }
            else { hearts--; updateHearts(); ce.classList.add('wrong'); setTimeout(function() { ce.classList.remove('wrong'); }, 500); if (hearts <= 0) alert("Dommage ! Plus de cœurs."); }
        }
        function prepareHint() {
            if (hearts <= 0) return; cancelCurrentHint(); let f = false; let txt = ""; pendingHintCell = null;
            for (let i = 0; i < 25; i++) {
                if (playerGrid[i] === "🐱") {
                    let r = Math.floor(i / 5), c = i % 5, reg = regions[i];
                    for (let j = 0; j < 25; j++) {
                        if (i !== j && playerGrid[j] === "") {
                            let row = Math.floor(j / 5), col = j % 5;
                            if (row === r || col === c || regions[j] === reg) {
                                pendingHintCell = j;
                                txt = "💡 <strong>Indice :</strong> La case clignotante (Ligne " + (row + 1) + ", Col " + (col + 1) + ") ne peut pas contenir de chat car elle est bloquée par votre chat en Ligne " + (r + 1) + ", Col " + (c + 1) + ".";
                                f = true; break;
                            }
                        }
                    }
                    if (f) break;
                }
            }
            if (!f) {
                for (let i = 0; i < 25; i++) {
                    if (solution[i] === true && playerGrid[i] !== "🐱") {
                        let r = Math.floor(i / 5), c = i % 5, reg = regions[i];
                        for (let j = 0; j < 25; j++) {
                            if (i !== j && playerGrid[j] === "") {
                                let row = Math.floor(j / 5), col = j % 5;
                                if (row === r || col === c || regions[j] === reg) {
                                    pendingHintCell = j;
                                    txt = "💡 <strong>Indice :</strong> La Ligne " + (r + 1) + " ou la zone <strong>" + getRegionName(reg) + "</strong> doit obligatoirement abriter un chat ailleurs. La case clignotante (Ligne " + (row + 1) + ", Col " + (col + 1) + ") doit donc être éliminée.";
                                    f = true; break;
                                }
                            }
                        }
                        if (f) break;
                    }
                }
            }
            if (f && pendingHintCell !== null) { document.getElementById('hint-explanation').innerHTML = txt; document.getElementById('hint-explanation').style.display = "block"; document.getElementById('btn-apply').style.display = "inline-block"; drawGrid(); }
            else { alert("Toutes les cases invalides évidentes ont déjà été marquées."); }
        }
        function applyHint() { if (pendingHintCell === null) return; if (playerGrid[pendingHintCell] === "") playerGrid[pendingHintCell] = "❌"; cancelCurrentHint(); }
        function cancelCurrentHint() { pendingHintCell = null; document.getElementById('hint-explanation').style.display = "none"; document.getElementById('btn-apply').style.display = "none"; drawGrid(); }
        function getRegionName(id) { const n = ["Rose", "Verte", "Bleue", "Jaune", "Violette"]; return n[id] || "Inconnue"; }
        function updateHearts() { document.getElementById('hearts-display').textContent = "❤️".repeat(Math.max(0, hearts)) || "☠️ Game Over"; }
        function checkWinCondition() { let w = true; for (let i = 0; i < 25; i++) { if (solution[i] === true && playerGrid[i] !== "🐱") w = false; } if (w) { setTimeout(function() { alert("🎉 Miaou-gnifique !"); cancelCurrentHint(); }, 200); } }
        function resetBoard() { playerGrid = Array(25).fill(""); hearts = 3; clickTimers = {}; cancelCurrentHint(); updateHearts(); }
        drawGrid();
    </script>
</body>
</html>
