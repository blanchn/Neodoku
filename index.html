<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NekoDoku</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NekoDoku">
    <style>
        :root {
            --bg-color: #fcf8f2;
            --card-color: #ffffff;
            --text-color: #3c2f2f;
            --border-color: #dcd6cd;
            /* Meowdoku style region colors */
            --color-0: #ffdfdf;
            --color-1: #dfffee;
            --color-2: #dfeeff;
            --color-3: #fffeed;
            --color-4: #f3dfff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        header {
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
        }

        .rules {
            font-size: 0.85rem;
            background-color: #fff;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            line-height: 1.3;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 4px;
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: var(--border-color);
            padding: 4px;
            border-radius: 12px;
            box-sizing: border-box;
        }

        .cell {
            background-color: var(--card-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            cursor: pointer;
            border-radius: 6px;
            transition: background-color 0.2s;
        }

        /* Color assignments for regions */
        .reg-0 { background-color: var(--color-0); }
        .reg-1 { background-color: var(--color-1); }
        .reg-2 { background-color: var(--color-2); }
        .reg-3 { background-color: var(--color-3); }
        .reg-4 { background-color: var(--color-4); }

        .cell.wrong {
            background-color: #ffb3b3 !important;
        }

        .tools {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .tool-btn {
            flex: 1;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            border: 2px solid var(--border-color);
            background: white;
            border-radius: 10px;
            cursor: pointer;
        }

        .tool-btn.active {
            background-color: #ff8e9e;
            color: white;
            border-color: #ff8e9e;
        }

        .action-btn {
            background-color: #4a5568;
            color: white;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🐱 NekoDoku</h1>
        </header>

        <div class="rules">
            <strong>Rules:</strong> 1 Cat per Row, Column, and Color block. Cats <u>cannot</u> touch each other at all (even diagonally).
        </div>

        <div class="status-bar">
            <div>Level: 5x5 Easy</div>
            <div id="hearts-display">❤️❤️❤️</div>
        </div>

        <div class="grid" id="game-grid"></div>

        <div class="tools">
            <button class="tool-btn active" id="btn-cat" onclick="setTool('cat')">Place 🐱</button>
            <button class="tool-btn" id="btn-x" onclick="setTool('x')">Mark ❌</button>
            <button class="tool-btn action-btn" onclick="resetBoard()">Restart</button>
        </div>
    </div>

    <script>
        // Pure 5x5 Meowdoku Map layout definition (Fixed numbers filled in)
        const regions = [
            0, 0, 0, 1, 1,
            0, 2, 2, 1, 1,
            2, 2, 2, 3, 3,
            4, 4, 3, 3, 3,
            4, 4, 4, 4, 4
        ];

        // The hidden target solution matching the exact ruleset
        const solution = [
            false, true,  false, false, false,
            false, false, false, true,  false,
            true,  false, false, false, false,
            false, false, true,  false, false,
            false, false, false, false, true
        ];

        let playerGrid = Array(25).fill(""); 
        let currentTool = "cat"; 
        let hearts = 3;

        function setTool(tool) {
            currentTool = tool;
            document.getElementById('btn-cat').classList.toggle('active', tool === 'cat');
            document.getElementById('btn-x').classList.toggle('active', tool === 'x');
        }

        function drawGrid() {
            const gridEl = document.getElementById('game-grid');
            gridEl.innerHTML = "";

            for (let i = 0; i < 25; i++) {
                const cell = document.createElement('div');
                cell.className = `cell reg-${regions[i]}`;
                cell.textContent = playerGrid[i];
                
                cell.addEventListener('click', () => handleCellClick(i, cell));
                gridEl.appendChild(cell);
            }
        }

        function handleCellClick(index, cellElement) {
            if (hearts <= 0) return;

            // If cell is occupied, tap it to clear it completely
            if (playerGrid[index] !== "") {
                playerGrid[index] = "";
                drawGrid();
                return;
            }

            if (currentTool === "x") {
                playerGrid[index] = "❌";
                drawGrid();
            } else if (currentTool === "cat") {
                // Validate if a Cat actually belongs here per solution map
                if (solution[index] === true) {
                    playerGrid[index] = "🐱";
                    drawGrid();
                    checkWinCondition();
                } else {
                    // Punish incorrect guesses with heart system loss
                    hearts--;
                    updateHearts();
                    cellElement.classList.add('wrong');
                    setTimeout(() => cellElement.classList.remove('wrong'), 500);

                    if (hearts <= 0) {
                        alert("No hearts remaining! Click restart to try again.");
                    }
                }
            }
        }

        function updateHearts() {
            const container = document.getElementById('hearts-display');
            container.textContent = "❤️".repeat(Math.max(0, hearts)) || "☠️ Game Over";
        }

        function checkWinCondition() {
            let won = true;
            for (let i = 0; i < 25; i++) {
                if (solution[i] === true && playerGrid[i] !== "🐱") {
                    won = false;
                }
            }
            if (won) {
                setTimeout(() => {
                    alert("🎉 Purr-fect! You solved the layout perfectly!");
                }, 200);
            }
        }

        function resetBoard() {
            playerGrid = Array(25).fill("");
            hearts = 3;
            updateHearts();
            drawGrid();
        }

        // Bootstrapping engine
        drawGrid();
    </script>
</body>
</html>
