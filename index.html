<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NekoDoku</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NekoDoku">
    <style>
        :root {
            --bg-color: #fcf8f2;
            --card-color: #ffffff;
            --text-color: #3c2f2f;
            --border-color: #dcd6cd;
            --color-0: #ffdfdf;
            --color-1: #dfffee;
            --color-2: #dfeeff;
            --color-3: #fffeed;
            --color-4: #f3dfff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        header {
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
        }

        .rules {
            font-size: 0.85rem;
            background-color: #fff;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            line-height: 1.4;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 4px;
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: var(--border-color);
            padding: 4px;
            border-radius: 12px;
            box-sizing: border-box;
        }

        .cell {
            background-color: var(--card-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            cursor: pointer;
            border-radius: 6px;
            transition: background-color 0.2s;
            touch-action: manipulation; 
        }

        .reg-0 { background-color: var(--color-0); }
        .reg-1 { background-color: var(--color-1); }
        .reg-2 { background-color: var(--color-2); }
        .reg-3 { background-color: var(--color-3); }
        .reg-4 { background-color: var(--color-4); }

        .cell.wrong {
            background-color: #ffb3b3 !important;
        }

        .tools {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .action-btn {
            flex: 1;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            background-color: #4a5568;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .hint-btn {
            background-color: #ff8e9e;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🐱 NekoDoku</h1>
        </header>

        <div class="rules">
            <strong>Contrôles :</strong> Un clic = ❌ | Double-clic = 🐱 <br>
            <strong>Règles :</strong> 1 Chat par ligne, colonne et bloc de couleur. Les chats ne doivent pas se toucher (même en diagonale).
        </div>

        <div class="status-bar">
            <div>Niveau: 5x5 Facile</div>
            <div id="hearts-display">❤️❤️❤️</div>
        </div>

        <div class="grid" id="game-grid"></div>

        <div class="tools">
            <button class="action-btn hint-btn" onclick="giveHint()">Indice 💡</button>
            <button class="action-btn" onclick="resetBoard()">Recommencer</button>
        </div>
    </div>

    <script>
        // Grille Meowdoku corrigée
        const regions = [
            0, 0, 0, 1, 1,
            0, 2, 2, 1, 3,
            2, 2, 4, 3, 3,
            4, 4, 4, 4, 3,
            4, 4, 4, 3, 3
        ];

        // Solution associée
        const solution = [
            false, true,  false, false, false,
            false, false, false, true,  false,
            true,  false, false, false, false,
            false, false, true,  false, false,
            false, false, false, false, true
        ];

        let playerGrid = Array(25).fill(""); 
        let hearts = 3;
        let clickTimers = {}; 

        function drawGrid() {
            const gridEl = document.getElementById('game-grid');
            gridEl.innerHTML = "";

            for (let i = 0; i < 25; i++) {
                const cell = document.createElement('div');
                cell.className = "cell reg-" + regions[i];
                cell.textContent = playerGrid[i];
                
                cell.addEventListener('click', (e) => {
                    e.preventDefault();
                    handleGridTouch(i, cell);
                });
                
                gridEl.appendChild(cell);
            }
        }

        function handleGridTouch(index, cellElement) {
            if (hearts <= 0) return;

            if (clickTimers[index]) {
                clearTimeout(clickTimers[index]);
                clickTimers[index] = null;
                executeDoubleClicks(index, cellElement);
            } else {
                clickTimers[index] = setTimeout(() => {
                    clickTimers[index] = null;
                    executeSingleClick(index);
                }, 250); 
            }
        }

        function executeSingleClick(index) {
            if (playerGrid[index] === "❌" || playerGrid[index] === "🐱") {
                playerGrid[index] = ""; 
            } else {
                playerGrid[index] = "❌"; 
            }
            drawGrid();
        }

        function executeDoubleClicks(index, cellElement) {
            if (playerGrid[index] === "🐱") {
                playerGrid[index] = "";
                drawGrid();
                return;
            }

            if (solution[index] === true) {
                playerGrid[index] = "🐱";
                drawGrid();
                checkWinCondition();
            } else {
                hearts--;
                updateHearts();
                cellElement.classList.add('wrong');
                setTimeout(() => cellElement.classList.remove('wrong'), 500);

                if (hearts <= 0) {
                    alert("Dommage ! Plus de cœurs disponibles. Cliquez sur Recommencer.");
                }
            }
        }

        function giveHint() {
            if (hearts <= 0) return;

            // Trouver un chat de la solution qui n'a pas encore été trouvé par le joueur
            let targetIndex = -1;
            for (let i = 0; i < 25; i++) {
                if (solution[i] === true && playerGrid[i] !== "🐱") {
                    targetIndex = i;
                    break;
                }
            }

            // Si tous les chats sont déjà placés
            if (targetIndex === -1) {
                alert("Vous avez déjà trouvé l'emplacement de tous les chats ! Remplissez le reste avec des croix ❌.");
                return;
            }

            // Calculer la ligne et la colonne du chat cible
            let targetRow = Math.floor(targetIndex / 5);
            let targetCol = targetIndex % 5;
            let targetRegion = regions[targetIndex];

            // Remplir stratégiquement la grille avec des croix d'aide
            let addedX = false;
            for (let i = 0; i < 25; i++) {
                let row = Math.floor(i / 5);
                let col = i % 5;
                
                // Si la case fait partie de la même ligne, colonne ou région, mais n'est pas le chat lui-même
                if (i !== targetIndex && (row === targetRow || col === targetCol || regions[i] === targetRegion)) {
                    if (playerGrid[i] === "") {
                        playerGrid[i] = "❌";
                        addedX = true;
                    }
                }
            }

            if (addedX) {
                drawGrid();
            } else {
                // Si les croix d'aide étaient déjà là, on montre directement l'emplacement du chat
                playerGrid[targetIndex] = "🐱";
                drawGrid();
                checkWinCondition();
            }
        }

        function updateHearts() {
            const container = document.getElementById('hearts-display');
            container.textContent = "❤️".repeat(Math.max(0, hearts)) || "☠️ Game Over";
        }

        function checkWinCondition() {
            let won = true;
            for (let i = 0; i < 25; i++) {
                if (solution[i] === true && playerGrid[i] !== "🐱") {
                    won = false;
                }
            }
            if (won) {
                setTimeout(() => {
                    alert("🎉 Miaou-gnifique ! Vous avez résolu la grille parfaitement !");
                }, 200);
            }
        }

        function resetBoard() {
            playerGrid = Array(25).fill("");
            hearts = 3;
            clickTimers = {};
            updateHearts();
            drawGrid();
        }

        drawGrid();
    </script>
</body>
</html>
